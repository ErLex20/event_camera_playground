header_include_path: moment_flow/moment_flow.hpp
namespace: moment_flow
node_class_name: EventDetector

params:
  autostart:
    type: bool
    default_value: false
    description: "Start detection right after node initialization."
    constraints: "Cannot be changed."
    read_only: true
    var_name: autostart_
  ba_filter_enabled:
    type: bool
    default_value: true
    description: "Enable Background Activity filter to suppress hot-pixel and shot noise."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: ba_filter_enabled_
  ba_filter_dt_ms:
    type: double
    default_value: 1.0
    min_value: 0.01
    max_value: 100.0
    step: 0.0
    description: "BA filter correlation time window [ms]. Events with no neighbour within this window are rejected."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: ba_filter_dt_ms_
  iwe_enabled:
    type: bool
    default_value: true
    description: "Enable global Image of Warped Events rendering and publishing."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: iwe_enabled_
  flow_enabled:
    type: bool
    default_value: true
    description: "Enable dense optical-flow estimation via moment-based incremental alignment."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_enabled_
  flow_max_window_ms:
    type: double
    default_value: 10.0
    min_value: 0.1
    max_value: 1000.0
    step: 0.0
    description: "Temporal span accumulated per flow estimate [ms]."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_max_window_ms_
  flow_num_scales:
    type: integer
    default_value: 5
    min_value: 1
    max_value: 8
    step: 1
    description: "Tile-pyramid scales; scale l uses 2^(l-1) tiles per side."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_num_scales_
  flow_cell_size_px:
    type: integer
    default_value: 16
    min_value: 1
    max_value: 256
    step: 1
    description: "Moment-grid cell size [px]."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_cell_size_px_
  flow_cell_min_mass:
    type: double
    default_value: 3.0
    min_value: 0.0
    max_value: 1000000.0
    step: 0.0
    description: "Minimum event mass required for a cell plane fit."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_cell_min_mass_
  flow_cell_min_lambda:
    type: double
    default_value: 0.001
    min_value: 0.0
    max_value: 1000000.0
    step: 0.0
    description: "Minimum dominant spatial covariance eigenvalue required for a cell plane fit."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_cell_min_lambda_
  flow_cell_max_residual_ratio:
    type: double
    default_value: 0.6
    min_value: 0.0
    max_value: 1.0
    step: 0.0
    description: "Maximum unexplained time-variance ratio accepted for each cell plane fit."
    constraints: "Cells above this ratio are rejected before tile aggregation."
    read_only: false
    var_name: flow_cell_max_residual_ratio_
  flow_tile_min_mass:
    type: double
    default_value: 10.0
    min_value: 0.0
    max_value: 1000000000.0
    step: 0.0
    description: "Minimum summed cell confidence required before solving a tile."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_tile_min_mass_
  flow_tile_min_cells:
    type: integer
    default_value: 3
    min_value: 0
    max_value: 1000000
    step: 1
    description: "Minimum valid cells required before solving a tile."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_tile_min_cells_
  flow_tile_min_lambda:
    type: double
    default_value: 0.000001
    min_value: 0.0
    max_value: 1000000000.0
    step: 0.0
    description: "Minimum tile geometry eigenvalue required before solving a tile."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_tile_min_lambda_
  flow_aperture_ratio:
    type: double
    default_value: 0.05
    min_value: 0.0
    max_value: 1.0
    step: 0.0
    description: "Minimum tile tensor eigenvalue ratio required for full 2D flow."
    constraints: "Must be in [0, 1]."
    read_only: false
    var_name: flow_aperture_ratio_
  flow_tikhonov_eps:
    type: double
    default_value: 0.001
    min_value: 0.000000000001
    max_value: 1000.0
    step: 0.0
    description: "Tikhonov regularization added to cell/tile dynamic solve terms."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_tikhonov_eps_
  flow_prior_lambda:
    type: double
    default_value: 0.05
    min_value: 0.0
    max_value: 1000.0
    step: 0.0
    description: "Relative fallback prior strength in each tile solve."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_prior_lambda_
  flow_reg_lambda:
    type: double
    default_value: 0.0
    min_value: 0.0
    max_value: 1000000000.0
    step: 0.0
    description: "Spatially coupled tile-flow regularization strength."
    constraints: "Set to 0, or set flow_reg_sweeps to 0, for an exact no-op."
    read_only: false
    var_name: flow_reg_lambda_
  flow_reg_sweeps:
    type: integer
    default_value: 0
    min_value: 0
    max_value: 16
    step: 1
    description: "Gauss-Seidel sweeps for coupled tile-flow regularization."
    constraints: "Set to 0, or set flow_reg_lambda to 0, for an exact no-op."
    read_only: false
    var_name: flow_reg_sweeps_
  flow_reg_sigma:
    type: double
    default_value: 1000000000.0
    min_value: 0.000001
    max_value: 1000000000000.0
    step: 0.0
    description: "Charbonnier edge threshold [px/s] for coupled regularization; very large is nearly isotropic."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_reg_sigma_
  flow_refine_enabled:
    type: bool
    default_value: false
    description: "Enable Stage C: compositional warped re-solve (CMax-style iterations) after the coarse-to-fine solve."
    constraints: "Set to false to skip the refinement stage."
    read_only: false
    var_name: flow_refine_enabled_
  flow_refine_iters:
    type: integer
    default_value: 2
    min_value: 0
    max_value: 20
    step: 1
    description: "Maximum Stage C warped re-solve iterations; early-stops at sub-pixel residual."
    constraints: "Must be non-negative; 0 disables the extra iterations."
    read_only: false
    var_name: flow_refine_iters_
  flow_iwe_scale:
    type: integer
    default_value: 1
    min_value: 1
    max_value: 8
    step: 1
    description: "Downscale factor for the rendered IWE image (1 = full resolution)."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_iwe_scale_
  flow_max_speed_px_s:
    type: double
    default_value: 4000.0
    min_value: 1.0
    max_value: 100000.0
    step: 0.0
    description: "Upper saturation speed for flow colour visualization [px/s]."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_max_speed_px_s_
  flow_save_enabled:
    type: bool
    default_value: false
    description: "Save raw dense optical-flow estimates as DSEC-compatible 16-bit PNG files."
    constraints: "Enable for offline benchmarking; leave disabled for live visualization."
    read_only: true
    var_name: flow_save_enabled_
  flow_save_output_dir:
    type: string
    default_value: "/home/neo/workspace/logs/moment_flow"
    description: "Directory where DSEC-format raw optical-flow PNGs are written."
    constraints: "Created automatically when flow_save_enabled is true."
    read_only: true
    var_name: flow_save_output_dir_
  flow_save_timestamp_file:
    type: string
    default_value: ""
    description: "Optional DSEC forward-flow timestamp file; when set, saved estimates are aligned to these intervals."
    constraints: "Rows must contain from_us,to_us and may optionally contain a file index."
    read_only: true
    var_name: flow_save_timestamp_file_
  flow_save_clear_output:
    type: bool
    default_value: true
    description: "Delete stale PNG files from flow_save_output_dir before saving a new benchmark run."
    constraints: "Only .png files in the output directory are removed."
    read_only: true
    var_name: flow_save_clear_output_
  flow_save_first_index:
    type: integer
    default_value: 2
    min_value: 0
    max_value: 9223372036854775807
    step: 1
    description: "First output file index when the timestamp file does not include explicit indices."
    constraints: "DSEC training flow for thun_00_a uses 2,4,6,..."
    read_only: true
    var_name: flow_save_first_index_
  flow_save_index_step:
    type: integer
    default_value: 2
    min_value: 1
    max_value: 9223372036854775807
    step: 1
    description: "Output file-index increment when the timestamp file does not include explicit indices."
    constraints: "DSEC training flow for thun_00_a uses a step of 2."
    read_only: true
    var_name: flow_save_index_step_
