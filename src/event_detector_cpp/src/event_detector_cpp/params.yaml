header_include_path: event_detector_cpp/event_detector_cpp.hpp
namespace: event_detector_cpp
node_class_name: EventDetector

params:
  autostart:
    type: bool
    default_value: false
    description: "Start detection right after node initialization."
    constraints: "Cannot be changed."
    read_only: true
    var_name: autostart_
  time_window_ms:
    type: double
    default_value: 33.0
    min_value: 1.0
    max_value: 1000.0
    step: 0.0
    description: "SAE normalization time window [ms]. Events older than this are rendered as black."
    constraints: "Must be positive."
    read_only: false
    var_name: time_window_ms_
  ba_filter_enabled:
    type: bool
    default_value: true
    description: "Enable Background Activity filter to suppress hot-pixel and shot noise."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: ba_filter_enabled_
  ba_filter_dt_ms:
    type: double
    default_value: 1.0
    min_value: 0.01
    max_value: 100.0
    step: 0.0
    description: "BA filter correlation time window [ms]. Events with no neighbour within this window are rejected."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: ba_filter_dt_ms_
  flow_enabled:
    type: bool
    default_value: true
    description: "Enable dense optical-flow estimation via contrast maximization."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_enabled_
  flow_window_ms:
    type: double
    default_value: 10.0
    min_value: 1.0
    max_value: 200.0
    step: 0.0
    description: "Event accumulation window per flow estimate [ms]."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_window_ms_
  flow_patch_size:
    type: integer
    default_value: 32
    min_value: 8
    max_value: 256
    step: 1
    description: "Side length of the square flow patches [px]; sets the dense-field grid resolution."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_patch_size_
  flow_min_events:
    type: integer
    default_value: 50
    min_value: 1
    max_value: 100000
    step: 1
    description: "Minimum events in a patch to estimate its velocity; sparser patches are left empty."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_min_events_
  flow_max_speed_px_s:
    type: double
    default_value: 4000.0
    min_value: 1.0
    max_value: 100000.0
    step: 0.0
    description: "Speed used to normalize flow colour and to bound the velocity search [px/s]."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_max_speed_px_s_
  flow_cmax_max_iter:
    type: integer
    default_value: 100
    min_value: 1
    max_value: 400
    step: 1
    description: "Maximum Levenberg-Marquardt function evaluations per patch (maxfev)."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_cmax_max_iter_
  flow_cmax_learning_rate:
    type: double
    default_value: 0.1
    min_value: 0.0001
    max_value: 10.0
    step: 0.0
    description: "Numerical-differentiation step factor for the contrast-maximization solver."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_cmax_learning_rate_