header_include_path: event_detector_cpp/event_detector_cpp.hpp
namespace: event_detector_cpp
node_class_name: EventDetector

params:
  autostart:
    type: bool
    default_value: false
    description: "Start detection right after node initialization."
    constraints: "Cannot be changed."
    read_only: true
    var_name: autostart_
  time_window_ms:
    type: double
    default_value: 33.0
    min_value: 1.0
    max_value: 1000.0
    step: 0.0
    description: "SAE normalization time window [ms]. Events older than this are rendered as black."
    constraints: "Must be positive."
    read_only: false
    var_name: time_window_ms_
  ba_filter_enabled:
    type: bool
    default_value: true
    description: "Enable Background Activity filter to suppress hot-pixel and shot noise."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: ba_filter_enabled_
  ba_filter_dt_ms:
    type: double
    default_value: 1.0
    min_value: 0.01
    max_value: 100.0
    step: 0.0
    description: "BA filter correlation time window [ms]. Events with no neighbour within this window are rejected."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: ba_filter_dt_ms_
  sae_enabled:
    type: bool
    default_value: true
    description: "Enable Surface of Active Events rendering and publishing."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: sae_enabled_
  iwe_enabled:
    type: bool
    default_value: true
    description: "Enable global Image of Warped Events rendering and publishing."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: iwe_enabled_
  flow_enabled:
    type: bool
    default_value: true
    description: "Enable dense optical-flow estimation via contrast maximization."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_enabled_
  flow_num_events:
    type: integer
    default_value: 30000
    min_value: 100
    max_value: 5000000
    step: 1
    description: "Events accumulated per flow estimate (the paper's set E_i of N events)."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_num_events_
  flow_num_scales:
    type: integer
    default_value: 5
    min_value: 1
    max_value: 8
    step: 1
    description: "Tile-pyramid scales; scale l uses 2^(l-1) tiles per side (Sec. III-D)."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_num_scales_
  flow_contrast_l2:
    type: bool
    default_value: false
    description: "Use squared-L2 IWE gradient focus instead of the L1 default (Eq. 6)."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_contrast_l2_
  flow_tv_weight:
    type: double
    default_value: 0.0025
    min_value: 0.0
    max_value: 10.0
    step: 0.0
    description: "Total-variation regularizer weight lambda (Eq. 9)."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_tv_weight_
  flow_tv_charbonnier_eps:
    type: double
    default_value: 0.001
    min_value: 0.000001
    max_value: 1.0
    step: 0.0
    description: "Charbonnier epsilon smoothing the isotropic TV norm (Sec. III-E)."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_tv_charbonnier_eps_
  flow_time_aware:
    type: bool
    default_value: false
    description: "Enable time-aware flow propagation (Sec. III-C) when supported by the objective."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_time_aware_
  flow_pde_burgers:
    type: bool
    default_value: false
    description: "Use the Burgers flux scheme for time-aware propagation instead of upwind."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_pde_burgers_
  flow_time_bins:
    type: integer
    default_value: 5
    min_value: 1
    max_value: 200
    step: 1
    description: "Number of temporal bins for time-aware propagation (5 MVSEC / 40 DSEC)."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_time_bins_
  flow_prop_grid:
    type: integer
    default_value: 32
    min_value: 4
    max_value: 256
    step: 1
    description: "Side length of the square propagation grid for time-aware flow."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_prop_grid_
  flow_newton_max_iter:
    type: integer
    default_value: 30
    min_value: 1
    max_value: 500
    step: 1
    description: "Maximum outer Newton iterations per scale for the truncated-Newton solver."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_newton_max_iter_
  flow_cg_max_iter:
    type: integer
    default_value: 20
    min_value: 1
    max_value: 500
    step: 1
    description: "Maximum inner conjugate-gradient iterations per Newton step."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_cg_max_iter_
  flow_cg_tol:
    type: double
    default_value: 0.1
    min_value: 0.000001
    max_value: 1.0
    step: 0.0
    description: "Forcing-tolerance factor for the inner CG solve (truncated Newton)."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_cg_tol_
  flow_iwe_scale:
    type: integer
    default_value: 1
    min_value: 1
    max_value: 8
    step: 1
    description: "Downscale factor for the rendered IWE image (1 = full resolution)."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_iwe_scale_
  flow_max_speed_px_s:
    type: double
    default_value: 4000.0
    min_value: 1.0
    max_value: 100000.0
    step: 0.0
    description: "Speed used to normalize flow colour and to clamp the estimated velocity [px/s]."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_max_speed_px_s_