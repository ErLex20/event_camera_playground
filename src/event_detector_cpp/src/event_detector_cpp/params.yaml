header_include_path: event_detector_cpp/event_detector_cpp.hpp
namespace: event_detector_cpp
node_class_name: EventDetector

params:
  autostart:
    type: bool
    default_value: false
    description: "Start detection right after node initialization."
    constraints: "Cannot be changed."
    read_only: true
    var_name: autostart_
  time_window_ms:
    type: double
    default_value: 33.0
    min_value: 1.0
    max_value: 1000.0
    step: 0.0
    description: "SAE normalization time window [ms]. Events older than this are rendered as black."
    constraints: "Must be positive."
    read_only: false
    var_name: time_window_ms_
  ba_filter_enabled:
    type: bool
    default_value: true
    description: "Enable Background Activity filter to suppress hot-pixel and shot noise."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: ba_filter_enabled_
  ba_filter_dt_ms:
    type: double
    default_value: 1.0
    min_value: 0.01
    max_value: 100.0
    step: 0.0
    description: "BA filter correlation time window [ms]. Events with no neighbour within this window are rejected."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: ba_filter_dt_ms_
  sae_enabled:
    type: bool
    default_value: true
    description: "Enable Surface of Active Events rendering and publishing."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: sae_enabled_
  iwe_enabled:
    type: bool
    default_value: true
    description: "Enable global Image of Warped Events rendering and publishing."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: iwe_enabled_
  flow_enabled:
    type: bool
    default_value: true
    description: "Enable dense optical-flow estimation via moment-based incremental alignment."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_enabled_
  flow_max_window_ms:
    type: double
    default_value: 10.0
    min_value: 0.1
    max_value: 1000.0
    step: 0.0
    description: "Temporal span accumulated per flow estimate [ms]."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_max_window_ms_
  flow_num_scales:
    type: integer
    default_value: 5
    min_value: 1
    max_value: 8
    step: 1
    description: "Tile-pyramid scales; scale l uses 2^(l-1) tiles per side."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_num_scales_
  flow_cell_size_px:
    type: integer
    default_value: 16
    min_value: 1
    max_value: 256
    step: 1
    description: "Moment-grid cell size [px]."
    constraints: "Cannot be changed at runtime."
    read_only: true
    var_name: flow_cell_size_px_
  flow_decay_enabled:
    type: bool
    default_value: false
    description: "Apply causal exponential decay inside each moment-flow window."
    constraints: "Disable for uniform CMax-like window alignment; enable for streaming recent-tail estimates."
    read_only: false
    var_name: flow_decay_enabled_
  flow_decay_tau_us:
    type: integer
    default_value: 30000
    min_value: 1
    max_value: 1000000
    step: 1
    description: "Exponential decay time constant for cell moments [us]."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_decay_tau_us_
  flow_tau_adaptive:
    type: bool
    default_value: false
    description: "Enable adaptive per-cell decay time constants."
    constraints: "Reserved; currently behaves as disabled."
    read_only: false
    var_name: flow_tau_adaptive_
  flow_cell_min_mass:
    type: double
    default_value: 3.0
    min_value: 0.0
    max_value: 1000000.0
    step: 0.0
    description: "Minimum decayed event mass required for a cell plane fit."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_cell_min_mass_
  flow_cell_min_lambda:
    type: double
    default_value: 0.001
    min_value: 0.0
    max_value: 1000000.0
    step: 0.0
    description: "Minimum dominant spatial covariance eigenvalue required for a cell plane fit."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_cell_min_lambda_
  flow_cell_max_residual_ratio:
    type: double
    default_value: 0.6
    min_value: 0.0
    max_value: 1.0
    step: 0.0
    description: "Maximum unexplained time-variance ratio accepted for each cell plane fit."
    constraints: "Cells above this ratio are rejected before tile aggregation."
    read_only: false
    var_name: flow_cell_max_residual_ratio_
  flow_tile_min_mass:
    type: double
    default_value: 10.0
    min_value: 0.0
    max_value: 1000000000.0
    step: 0.0
    description: "Minimum summed cell confidence required before solving a tile."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_tile_min_mass_
  flow_tile_min_cells:
    type: integer
    default_value: 3
    min_value: 0
    max_value: 1000000
    step: 1
    description: "Minimum valid cells required before solving a tile."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_tile_min_cells_
  flow_tile_min_lambda:
    type: double
    default_value: 0.000001
    min_value: 0.0
    max_value: 1000000000.0
    step: 0.0
    description: "Minimum tile structure-tensor eigenvalue required before solving a tile."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_tile_min_lambda_
  flow_aperture_ratio:
    type: double
    default_value: 0.05
    min_value: 0.0
    max_value: 1.0
    step: 0.0
    description: "Minimum tile tensor eigenvalue ratio required for full 2D flow."
    constraints: "Must be in [0, 1]."
    read_only: false
    var_name: flow_aperture_ratio_
  flow_tikhonov_eps:
    type: double
    default_value: 0.001
    min_value: 0.000000000001
    max_value: 1000.0
    step: 0.0
    description: "Tikhonov regularization added to cell and tile 2x2 solves."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_tikhonov_eps_
  flow_prior_lambda:
    type: double
    default_value: 0.05
    min_value: 0.0
    max_value: 1000.0
    step: 0.0
    description: "Relative fallback prior strength in each tile solve."
    constraints: "Must be non-negative."
    read_only: false
    var_name: flow_prior_lambda_
  flow_smooth_iters:
    type: integer
    default_value: 0
    min_value: 0
    max_value: 16
    step: 1
    description: "Optional tile-field smoothing passes after each moment-flow scale."
    constraints: "Set to 0 to disable."
    read_only: false
    var_name: flow_smooth_iters_
  flow_smooth_alpha:
    type: double
    default_value: 0.0
    min_value: 0.0
    max_value: 1.0
    step: 0.0
    description: "Blend factor for each tile-field smoothing pass."
    constraints: "Must be in [0, 1]."
    read_only: false
    var_name: flow_smooth_alpha_
  flow_refine_enabled:
    type: bool
    default_value: false
    description: "Enable robust iterative refinement of the moment-flow estimate."
    constraints: "Reserved; currently behaves as disabled."
    read_only: false
    var_name: flow_refine_enabled_
  flow_refine_iters:
    type: integer
    default_value: 2
    min_value: 0
    max_value: 20
    step: 1
    description: "Robust refinement iterations."
    constraints: "Reserved until robust refinement is implemented."
    read_only: false
    var_name: flow_refine_iters_
  flow_refine_huber_delta:
    type: double
    default_value: 0.01
    min_value: 0.000000001
    max_value: 1000000.0
    step: 0.0
    description: "Huber delta for robust refinement residual weighting."
    constraints: "Reserved until robust refinement is implemented."
    read_only: false
    var_name: flow_refine_huber_delta_
  flow_iwe_scale:
    type: integer
    default_value: 1
    min_value: 1
    max_value: 8
    step: 1
    description: "Downscale factor for the rendered IWE image (1 = full resolution)."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_iwe_scale_
  flow_max_speed_px_s:
    type: double
    default_value: 4000.0
    min_value: 1.0
    max_value: 100000.0
    step: 0.0
    description: "Upper saturation speed for flow colour visualization [px/s]."
    constraints: "Must be positive."
    read_only: false
    var_name: flow_max_speed_px_s_
