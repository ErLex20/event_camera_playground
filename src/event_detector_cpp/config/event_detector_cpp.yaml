/event_detector_cpp:
  ros__parameters:
    dua:
      tf_server:
        get_transform: true
        transform_pose: false
        wait_servers: false
    autostart: true
    time_window_ms: 10.0
    ba_filter_enabled: true
    ba_filter_dt_ms: 1.0
    sae_enabled: true
    iwe_enabled: true
    flow_enabled: true
    flow_max_window_ms: 10.0          # 10->25: in 10 ms l'accel e' ~0 => order-2 == order-1. Serve l'arco per fittarla
    flow_num_scales: 6                # 8->6: fine = 32x32 (setting DSEC del paper). 128x128 su VGA = tile 5px ~1 cella => vuoti + smooth 12ms
    flow_cell_size_px: 6              # 4->6: piu' eventi/cella => fit stabili, meno celle a singola orientazione
    flow_decay_enabled: false
    flow_decay_tau_us: 30000
    flow_tau_adaptive: false
    flow_cell_min_mass: 3.0           # 1->3: una cella 4px con 1 evento e' rumore
    flow_cell_min_lambda: 0.0005
    flow_cell_max_residual_ratio: 0.95

    flow_tile_min_mass: 15.0          # unita' di massa-eventi (q=1): filtra i tile quasi vuoti
    flow_tile_min_cells: 2
    flow_tile_min_lambda: 0.00001
    flow_time_aware_order: 2
    flow_aperture_ratio: 0.08
    flow_tikhonov_eps: 0.005          # 0.01->0.005: meno shrinkage della velocita'

    flow_prior_lambda: 0.2            # 1.0->0.2: sblocca l'accel (8*prior 8->1.6 => a al ~38% non 11%) E velocita' fallback 50%->17%
    flow_smooth_alpha: 0.6            # 0.6->0.4
    flow_smooth_iters: 4              # 4->2: era l'83% del tempo di solve a 8 scale

    flow_refine_enabled: false
    flow_refine_iters: 2
    flow_refine_huber_delta: 0.01
    flow_iwe_scale: 1
    flow_max_speed_px_s: 3000.0